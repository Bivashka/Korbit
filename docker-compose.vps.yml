services:
  postgres:
    image: postgres:16-alpine
    container_name: korbit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - korbit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: korbit_redis
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/korbit-api/Dockerfile
    container_name: korbit_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      REGISTRATION_MODE: ${REGISTRATION_MODE}
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      UPLOAD_DIR: uploads
      UPLOAD_PUBLIC_PREFIX: /api/uploads
      MAX_UPLOAD_SIZE: 10485760
      KORBIT_PUBLIC_WEB_URL: ${CORS_ORIGIN}
      KORBIT_BUILD_ROOT: ${KORBIT_BUILD_ROOT_CONTAINER:-/opt/korbit}
    ports:
      - '127.0.0.1:4000:4000'
    volumes:
      - korbit_uploads_data:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock
      - ${KORBIT_BUILD_ROOT_HOST:-/opt/korbit}:${KORBIT_BUILD_ROOT_CONTAINER:-/opt/korbit}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:4000/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/korbit-web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_REGISTRATION_MODE: ${NEXT_PUBLIC_REGISTRATION_MODE}
    container_name: korbit_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_REGISTRATION_MODE: ${NEXT_PUBLIC_REGISTRATION_MODE}
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  korbit_postgres_data:
  korbit_uploads_data:
